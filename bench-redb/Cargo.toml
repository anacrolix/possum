[package]
name = "possum-redb-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs redb's storage engine benchmarks against possum"
license = "MPL-2.0"

# Standalone, so its dependencies stay out of possum's build.
[workspace]

[dependencies]
possum-db = { path = ".." }
# Pinned so results are comparable between runs. Bump both together.
redb = { git = "https://github.com/cberner/redb", rev = "96ce31fe5cafcf735425a02f1781487a4287e2de", features = ["experimental-api-5"] }
redb-bench = { git = "https://github.com/cberner/redb", rev = "96ce31fe5cafcf735425a02f1781487a4287e2de" }

[dev-dependencies]
ctrlc = "3.2.3"
env_logger = "0.11"
fjall = "=3.1.6"
heed = { version = "0.22", default-features = false }
rand = "0.10.1"
tempfile = "3.5.0"

[[bench]]
name = "lmdb_benchmark"
harness = false

[[bench]]
name = "large_values_benchmark"
harness = false

[profile.bench]
debug = true
